# Arthik CI on GitLab (free tier).
#
#   every push / merge request  test           go vet + go test on a GitLab shared runner (about a minute)
#   tag vX.Y.Z (= VERSION)      release-files  signed APK, built on gtlbrunner (your own Docker runner,
#                                              tag arthik-app) inside arthik-builder, uploaded
#                                              to the project's package registry
#                               release        a GitLab release with the CHANGELOG section and the APK
#
# The newest APK is always at
#   https://gitlab.com/<you>/arthik/-/releases/permalink/latest/downloads/arthik.apk
# Runner setup: gtlbrunner's README (apps: arthik), and README → "Releases and the Android APK".

stages: [test, build, release]

variables:
  PKG_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/arthik/${CI_COMMIT_TAG}

test:
  stage: test
  image: golang:1.23
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_COMMIT_TAG
  script:
    - go vet ./...
    - go test ./...

# Runs on gtlbrunner's Docker executor inside arthik-builder (built there from
# docker/builder/). The runner mounts the build cache at /build-cache and the
# signing key at /keys (read-only); the job gets no Docker of its own.
release-files:
  stage: build
  tags: [arthik-app]
  image: arthik-builder:1           # = image: of arthik-builder in gtlbrunner's docker-compose.yml
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    BUILD_CACHE: /build-cache
    KEY_DIR: /keys
  script:
    - '[ "v$(cat VERSION)" = "$CI_COMMIT_TAG" ] || { echo "tag $CI_COMMIT_TAG does not match VERSION $(cat VERSION)"; exit 1; }'
    - bash scripts/build-in-container.sh ci
    - sh scripts/upload-release.sh    # package registry + release-notes.md
  artifacts:
    paths: [dist/release/, release-notes.md]
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest    # glab, used by the release: keyword
  needs: [release-files]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Arthik $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: arthik-$CI_COMMIT_TAG.apk
          url: ${PKG_URL}/arthik-${CI_COMMIT_TAG}.apk
          link_type: package
          direct_asset_path: /arthik.apk
        - name: SHA256SUMS
          url: ${PKG_URL}/SHA256SUMS
          link_type: other
