# Arthik CI on GitLab (free tier).
#
#   every push / merge request  test     go vet + go test on a GitLab shared runner (about a minute)
#   tag vX.Y.Z (= VERSION)      apk      signed APK built by your own runner (tag: arthik-apk),
#                                        uploaded to the project's package registry
#                               release  a GitLab release with the CHANGELOG section and the APK
#
# The newest APK is always at
#   https://gitlab.com/<you>/arthik/-/releases/permalink/latest/downloads/arthik.apk
# Runner setup: README → "Releases and the Android APK".

stages: [test, build, release]

test:
  stage: test
  image: golang:1.23
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_COMMIT_TAG
  script:
    - go vet ./...
    - go test ./...

apk:
  stage: build
  tags: [arthik-apk]                    # your self-hosted shell runner (Docker + signing key); uses no CI minutes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e android/.cache/   # keep the SDK and Gradle caches between releases
  script:
    - VERSION=$(cat VERSION)
    - '[ "v$VERSION" = "$CI_COMMIT_TAG" ] || { echo "tag $CI_COMMIT_TAG does not match VERSION $VERSION"; exit 1; }'
    - ./android/build.sh
    - cp "android/dist/arthik-$VERSION.apk" arthik.apk
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file arthik.apk
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/arthik/$CI_COMMIT_TAG/arthik-$CI_COMMIT_TAG.apk"'
    # release notes: this version's section of CHANGELOG.md
    - awk -v v="$VERSION" '/^## /{p = index($0 " ", "## " v " ") == 1; next} p' CHANGELOG.md > release-notes.md
    - '[ -s release-notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }'
  artifacts:
    paths: [release-notes.md]
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest    # glab, used by the release: keyword
  needs: [apk]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Arthik $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: arthik-$CI_COMMIT_TAG.apk
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/arthik/$CI_COMMIT_TAG/arthik-$CI_COMMIT_TAG.apk
          link_type: package
          direct_asset_path: /arthik.apk
