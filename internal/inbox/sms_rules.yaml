# Built-in patterns that turn bank SMS into drafts. Add your own (or override these)
# in <finance>/inbox/sms_rules.md using the same layout; your rules are tried first.
#
# Each rule is a regular expression (Go RE2 syntax) with named groups:
#   amount (required)  digits  merchant  date  time  dir  balance  available
# {amount} {date} {time} {digits} below expand to the macros, so rules stay readable.
# type: expense | income | transfer_in (money arriving on a card/loan: a payment)
#       | auto (decided by the "dir" group or the words in credit_words / debit_words)

macros:
  amount: '[\d,]+(?:\.\d{1,2})?'
  date: '\d{4}-\d{2}-\d{2}|\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}|\d{1,2}[- ]?[A-Za-z]{3}[- ,]*\d{2,4}'
  time: '\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AaPp]\.?[Mm]\.?)?'
  cur: '(?:INR|Rs\.?|₹)'

# Dates in Indian SMS are day-first. Tried in order after normalising separators to "-".
date_layouts: ['2006-01-02', '02-01-2006', '2-1-2006', '02-01-06', '2-1-06', '02-Jan-2006', '02-Jan-06', '2-Jan-06', '02Jan2006', '02Jan06']

# Messages matching any of these are never imported.
ignore:
  - '(?i)\botp\b|one[- ]time password|verification code|\bcode is\b'
  - '(?i)\b(?:will be|to be|shall be)\s+(?:debited|charged)'
  - '(?i)\brequest(?:ed)?\b.*\b(?:debit|money|collect)|\bcollect request\b'
  - '(?i)\b(?:declined|failed|unsuccessful|could not be processed)\b'
  - '(?i)\b(?:is|are)\s+due\b|\bdue\s+(?:date|on|by)\b|minimum\s+(?:amount\s+)?due|total\s+(?:amount\s+)?due'
  - '(?i)pre-?approved|\boffer\b|\bloan of\b|\bapply now\b|\bcashback upto\b'

credit_words: [credited, received, deposited, refund, refunded, reversed, reversal, cashback]
debit_words: [debited, spent, paid, withdrawn, purchase, sent, charged]

# Used by "generic" rules to find the parts a rule did not capture.
find_digits: '(?i)(?:card|a/?c|account|acct)\.?\s*(?:no\.?\s*)?(?:ending\s+(?:with\s+|in\s+)?)?[X*]*\d*?(\d{4})\b'
find_merchant:
  - '(?i)(?:\bat|@)\s*([A-Za-z][A-Za-z0-9 ._&-]{2,40}?)(?:\s+on\b|\s+ref|\.|,|$)'
  - '(?i)\bby\s+([A-Za-z][A-Za-z0-9 ._&-]{2,40}?)(?:\s+on\b|\s+ref|\.|,|$)'
  - '(?i)(?:\bto|\btowards|\bfrom)\s+(?:vpa\s+)?((?:[A-Za-z][A-Za-z0-9._&-]*)(?:\s+(?:[A-Za-z][A-Za-z0-9._&-]*)){0,4}?)(?:\s+on\b|\s+ref|\.|,|$)'

# Cleaned from the merchant text before it is shown or learned.
merchant_strip:
  - '(?i)^(?:upi|vpa|imps|neft|rtgs|pos|ecom|nfc)[\s/_:-]+'
  - '(?i)\s+(?:ref|rrn|txn|utr)\b.*$'
  - '(?i)\s+on\s+\d.*$'
  - '@[a-z0-9.]+$'
  - '[\s.,:;-]+$'

rules:
  # INR 20.00 spent on YES BANK Card X3222 @UPI_RAVI KUMAR 10-10-2026 09:57:36 pm. Avl Lmt INR 150,000.00
  # Rs.131.00 spent on your SBI Credit Card ending 6444 at SWIGGYPVTLTDFOOD1 on 09/10/26.
  - name: card-spent
    type: expense
    match: '(?i){cur}\s*(?P<amount>{amount})\s+(?:was\s+|has\s+been\s+)?spent\s+(?:on|using|via)\s+(?:your\s+)?.*?card\s+(?:no\.?\s+)?(?:ending\s+(?:with\s+|in\s+)?)?[X*]*(?P<digits>\d{4})\s+(?:@\s*|at\s+|on\s+)(?P<merchant>.+?)\s+(?:on\s+)?(?P<date>{date})(?:[\s:]+(?P<time>{time}))?(?:.*?(?:avl|available)\.?\s+(?:lmt|limit|bal(?:ance)?)\.?[:\s]*{cur}?\s*(?P<available>{amount}))?'

  # Spent Rs.2000 On HDFC Bank Card 4111 At GYFTR VIA SMARTBUY On 2026-10-09:20:34:36
  - name: card-spent-verb-first
    type: expense
    match: '(?i)(?:spent|txn of|transaction of|purchase of)\s+{cur}\s*(?P<amount>{amount})\s+(?:on|using)\s+.*?card\s+(?:ending\s+(?:with\s+)?)?[X*]*(?P<digits>\d{4})\s+(?:at|@)\s+(?P<merchant>.+?)\s+on\s+(?P<date>{date})(?:[\s:]+(?P<time>{time}))?'

  # Payment of Rs 5,000 received towards your SBI Credit Card ending 6444
  # Payment of Rs.5000 has been credited to your HDFC Bank Credit Card XX4111
  - name: card-payment
    type: transfer_in
    match: '(?i)payment\s+of\s+{cur}\s*(?P<amount>{amount})\s+(?:has\s+been\s+|is\s+|was\s+)?(?:received|credited|successful)\s+(?:towards|to|on|against|for)\s+(?:your\s+)?.*?card\s+(?:no\.?\s+)?(?:ending\s+(?:with\s+|in\s+)?)?[X*]*(?P<digits>\d{4})(?:.*?on\s+(?P<date>{date}))?'
  - name: card-payment-received
    type: transfer_in
    match: '(?i)received\s+(?:a\s+|your\s+)?payment\s+of\s+{cur}\s*(?P<amount>{amount}).*?card\s+(?:no\.?\s+)?(?:ending\s+(?:with\s+|in\s+)?)?[X*]*(?P<digits>\d{4})(?:.*?on\s+(?P<date>{date}))?'

  # Your A/C XXXXX819001 is credited with INR 400.00 on 10/10/26 23:53. Your new balance is INR 1,23,456.78
  # A/c XX1234 debited by Rs.500.00 on 09Oct26 trf to RAVI SHANKAR Refno 1234
  - name: account-first
    type: auto
    match: '(?i)a/?c\.?\s*(?:no\.?\s*)?[X*]*\d*?(?P<digits>\d{3,4})\s+(?:is\s+|has\s+been\s+|was\s+)?(?P<dir>credited|debited)\s+(?:with|by|for)\s+{cur}\s*(?P<amount>{amount})(?:\s+on\s+(?P<date>{date})(?:\s+(?P<time>{time}))?)?(?:.*?(?:trf\s+to|transfer\s+to|transferred\s+to|to\s+vpa|from\s+vpa|by|from|towards)\s+(?P<merchant>[A-Za-z][A-Za-z0-9 ._@&-]{2,40}?)(?:\s+ref|\s+rrn|\s+on\b|\.|$))?(?:.*?bal(?:ance)?(?:\s+is)?[:\s]*{cur}\s*(?P<balance>{amount}))?'

  # Rs.500.00 debited from A/c XX1234 on 09-10-26 to VPA shop@okaxis
  # INR 12,000.00 credited to your A/c XX9001 on 01/10/26 by SALARY ACME
  - name: amount-first
    type: auto
    match: '(?i){cur}\s*(?P<amount>{amount})\s+(?:has\s+been\s+|is\s+|was\s+)?(?P<dir>credited|debited|deposited|withdrawn)\s+(?:to|from|in|into)\s+(?:your\s+)?(?:a/?c|account|acct)\.?\s*(?:no\.?\s*)?[X*]*\d*?(?P<digits>\d{3,4})\b(?:.*?on\s+(?P<date>{date})(?:\s+(?P<time>{time}))?)?(?:.*?(?:to\s+vpa|from\s+vpa|to|by|from|towards)\s+(?P<merchant>[A-Za-z][A-Za-z0-9 ._@&-]{2,40}?)(?:\s+ref|\s+rrn|\s+on\b|\.|$))?(?:.*?bal(?:ance)?(?:\s+is)?[:\s]*{cur}\s*(?P<balance>{amount}))?'

  # Anything else that names an amount and says money moved. Marked "check".
  - name: generic
    type: auto
    generic: true
    match: '(?i){cur}\s*(?P<amount>{amount})'
